# Licenses accepted for dependencies, in priority order (cargo-about picks the first one that
# satisfies each crate's SPDX expression). Slint resolves to GPL-3.0-only (see NOTICE).
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "NCSA",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
ignore-dev-dependencies = true
