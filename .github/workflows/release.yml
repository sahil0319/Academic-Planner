name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches workspace version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "app") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $version (expected v$version)"
            exit 1
          fi
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.3
      - name: Generate third-party notices
        run: cargo about generate --workspace --locked --fail -o THIRD-PARTY-NOTICES.html about.hbs
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.html
          if-no-files-found: error

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # R28: the updater artifacts (.app.tar.gz, -setup.exe, .AppImage) are signed; the
          # .sig files feed latest.json in the release job.
          - os: macos-latest
            formats: app,dmg
            files: |
              target/release/*.dmg
              target/release/*.app.tar.gz
              target/release/*.app.tar.gz.sig
          - os: windows-latest
            formats: nsis
            files: |
              target/release/*-setup.exe
              target/release/*-setup.exe.sig
          - os: ubuntu-22.04
            formats: deb,appimage
            files: |
              target/release/*.deb
              target/release/*.AppImage
              target/release/*.AppImage.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # R28: without the signing key no update could be verified, so the build stops here.
      - name: Check signing secrets
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ] || [ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Secrets CARGO_PACKAGER_SIGN_PRIVATE_KEY and CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD must both be set"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: third-party-notices
          path: .
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Package
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: cargo packager -p app --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Release notes live in docs/releases/<tag>.md; a tag without notes fails here, before
      # anything is published.
      - uses: actions/checkout@v7
      - name: Check release notes exist
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md" || { echo "::error::Missing docs/releases/${GITHUB_REF_NAME}.md"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # GitHub stores asset names with spaces replaced by "."; renaming first keeps the
      # manifest URLs equal to the uploaded names.
      - name: Normalize artifact names
        shell: bash
        run: |
          for f in dist/*' '*; do
            [ -e "$f" ] || continue
            mv -- "$f" "dist/$(basename "$f" | tr ' ' '.')"
          done
      # R27, R28: the updater manifest the app reads from releases/latest/download/latest.json.
      - name: Write updater manifest
        run: bash scripts/updater-manifest.sh "$GITHUB_REF_NAME" dist "docs/releases/${GITHUB_REF_NAME}.md" > dist/latest.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Academic Planner ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          fail_on_unmatched_files: true
          files: dist/*
