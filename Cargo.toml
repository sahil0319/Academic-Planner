[workspace]
members = ["crates/core", "crates/app"]
# MSRV-aware dependency resolution: keeps the lockfile buildable on `rust-version`.
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
csv = "1"
directories = "6"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.16"
slint-build = "1.16"
thiserror = "2"
